# ============================================================
# GitHub Actions E2E Pipeline (Playwright)
# ============================================================
#
# WHAT IS THIS WORKFLOW?
# Runs full end-to-end browser integration tests with Playwright.
#
# TRIGGERS:
# 1. On merge/push to develop or main branches.
# 2. On-demand manual trigger via the "Run workflow" button.
# 3. On pull requests when labeled with 'run-e2e'.
# ============================================================

name: E2E — Playwright Tests

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

jobs:
  e2e:
    name: 🎭 Playwright E2E Tests
    # Only run on PR if labeled with 'run-e2e', or on push / workflow_dispatch
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
        contains(toJson(github.event.pull_request.labels), 'run-e2e') ||
        github.event.label.name == 'run-e2e'
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter_password
          POSTGRES_DB: starter_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://starter:starter_password@localhost:5432/starter_e2e
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: e2e-secret-key-32-characters-minimum-length
      BETTER_AUTH_URL: http://localhost:5002
      NEXT_PUBLIC_APP_URL: http://localhost:5002
      NEXT_PUBLIC_API_URL: http://localhost:5002
      GOOGLE_CLIENT_ID: mock-e2e-google-client-id
      GOOGLE_CLIENT_SECRET: mock-e2e-google-client-secret
      RESEND_API_KEY: re_mock_e2e_resend_api_key
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @starter/e2e exec playwright install --with-deps chromium

      - name: Setup Database Schema & Seed
        run: |
          pnpm db:push
          pnpm db:seed

      - name: Run Playwright Tests
        run: pnpm test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14
